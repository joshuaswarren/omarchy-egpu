# The eGPU NVIDIA modules load only from the eGPU load step (omarchy-egpu-load.service), after the identity emulation. An alias load from
# udev on an unprepared tunnel fails kbusVerifyBar2. nvidia_drm has the PCI aliases (VGA/3D class) and pulls nvidia in as a dependency,
# so all four modules are listed. An explicit modprobe nvidia still works.
blacklist nvidia
blacklist nvidia_modeset
blacklist nvidia_drm
blacklist nvidia_uvm
